name: Feature request
description: Suggest an enhancement to pi-caveman.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check the [Contributing guide](../../CONTRIBUTING.md#what-belongs-in-pi-caveman) first — some proposals belong upstream at [caveman](https://github.com/juliusbrussee/caveman) or in a separate pi-package rather than in pi-caveman.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain does this solve? Why is the current behavior insufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Concrete shape — new slash command, mode dialect, ruleset hook, cavecrew subagent, config knob, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you rejected them.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which bucket does this proposal fit?
      options:
        - bootstrap / commands / cavecrew loader / stats (in scope for pi-caveman)
        - pi-core / pi-tui / pi-ai (upstream to pi-mono — https://github.com/badlogic/pi-mono)
        - caveman ruleset / mode dialect (upstream to caveman — https://github.com/juliusbrussee/caveman)
    validations:
      required: true
