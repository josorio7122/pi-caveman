name: Bug report
description: Report something that's broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the sections below so we can reproduce the issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I run `/caveman ultra`, the model still produces verbose prose…
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal command sequence or repro that triggers the bug.
      placeholder: |
        1. Start pi with `pi -e /path/to/pi-caveman/src/index.ts`
        2. Run `/caveman ultra`
        3. Send prompt "explain the file foo.ts"
        4. Observe…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Caveman ultra mode should produce single-line, ultra-compressed output.
    validations:
      required: true

  - type: input
    id: pi-caveman-version
    attributes:
      label: pi-caveman version
      description: Output of `npm ls pi-caveman` or the tag you installed.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: pi-version
    attributes:
      label: pi / pi-coding-agent version
      placeholder: 0.65.x
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, Node version, model provider.
      placeholder: |
        - OS: macOS 14.5
        - Node: v20.10.0
        - Model: anthropic/claude-sonnet-4-6
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant stack traces, conversation log snippets, or `CAVEMAN_DEBUG=1` stderr.
      render: shell
    validations:
      required: false
